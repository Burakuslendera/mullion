name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A quiet week is not evidence the runtime still exports the entry point
  # mullion calls. The weekly run makes the required WebView2 check below a
  # standing early-warning wire. Scheduled runs use the default branch's workflow.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo - it builds,
# tests and scans, and writes nothing back (no PR comments, no releases). The
# default token grant is read/write; narrowing it to contents:read means a
# compromised step cannot push, comment or cut a release (issue #13).
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # GitHub's windows-latest runner is amd64. This is the only job that makes a
    # WebView2 runtime-support claim; the Windows cross-builds below do not.
    # Both ends of the supported range, not just the floor. Until decision 0033
    # this job pinned "1.22" alone, so the "and newer" half of the promise in
    # README.md was never verified by anything. "stable" is the current release,
    # whatever it is on the day the job runs.
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    # The windows-latest runner ships the Evergreen WebView2 runtime (measured
    # via the doctor probe: v149.0.4022.98), so the two machine tests in
    # internal/webview2 must run, not skip. This turns their "no runtime" skip
    # into a failure, so a green windows job proves the export mullion calls was
    # actually checked rather than quietly stepped over. See docs/decisions/0010.
    env:
      MULLION_REQUIRE_WEBVIEW2: "1"
    steps:
      # Full history, not the default shallow clone: leak-scan below scans commit
      # messages (git log), which a fetch-depth=1 checkout truncates to the single
      # tip/merge commit. See issue #71.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      # The wider hygiene net (leak_test.go covers only the narrow, portable
      # subset). Scans tracked files and commit messages for anything that must
      # never be published.
      - name: leak-scan
        run: pwsh scripts/leak-scan.ps1

      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

      # Execute the production runtime/export diagnostic directly as well as
      # the machine tests. This still fails if a cached or accidentally removed
      # test would otherwise turn the required WebView2 check green.
      - run: go test -count=1 ./internal/webview2 -run '^(TestFindRuntimeOnThisMachine|TestRuntimeExportsTheEntryPointWeCallDirectly)$'
      - run: go run ./cmd/mullion doctor
      - run: node scripts/test-bridge.mjs

      # A real 32-bit Windows process runs under WOW64 on the amd64 runner.
      # These production-entry regressions require no runtime and prove the
      # architecture gate precedes discovery, DLL, COM, callback, class and HWND
      # work. ARM64 remains compile-only below because this runner cannot execute
      # an ARM64 process.
      - name: execute unsupported Windows/386 production gates under WOW64
        shell: pwsh
        run: |
          $env:GOARCH = '386'
          go test -count=1 ./internal/webview2 ./internal/doctor ./host -run '^TestUnsupportedArchitecture'
          $doctorOut = Join-Path $env:RUNNER_TEMP "mullion-doctor-$PID.out"
          $doctorErr = Join-Path $env:RUNNER_TEMP "mullion-doctor-$PID.err"
          $doctorProcess = Start-Process -FilePath go -ArgumentList @('run', './cmd/mullion', 'doctor') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $doctorOut -RedirectStandardError $doctorErr
          $doctor = (Get-Content -Raw $doctorOut) + (Get-Content -Raw $doctorErr)
          Remove-Item $doctorOut, $doctorErr
          if ($doctorProcess.ExitCode -ne 1) {
            throw "unsupported Windows/386 doctor exit = $($doctorProcess.ExitCode), want 1`n$doctor"
          }
          if ($doctor -notmatch 'windows/amd64') {
            throw "unsupported Windows/386 doctor did not report the architecture sentinel`n$doctor"
          }
          if ($doctor -match 'backdrop callback allocated') {
            throw "doctor allocated the backdrop callback before its architecture gate`n$doctor"
          }
      # The Host runs timers on their own goroutines; the race detector is not
      # ceremony here.
      - run: go test -count=1 -race ./...

      # Plain `go build ./...` never compiles a tagged file. Without these two
      # steps the diagnostic builds rot silently.
      - run: go build -tags mullion_dwm_caption_diag ./...
      - run: go test -count=1 -tags mullion_dwm_caption_diag ./...
      - run: go build -tags mullion_caption_passthrough_diag ./...
      - run: go test -count=1 -tags mullion_caption_passthrough_diag ./...

  # Keep the supported process ABI visible as its own singleton lane. The two
  # Windows matrix jobs also run on amd64, but their names describe Go versions;
  # this job makes target drift or accidental matrix-only coverage explicit.
  windows-x64:
    name: windows x64
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      MULLION_REQUIRE_WEBVIEW2: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: build Windows/x64
        run: go build ./...
      - name: test Windows/x64
        run: go test -count=1 ./...

  portable:
    # Non-Windows stubs and unsupported Windows architectures stay
    # compile-portable. These builds are not runtime-support claims; WebView2
    # hosting is proved by the Windows matrix and explicit x64 job above.
    runs-on: ubuntu-latest
    # Same two-ended range as the windows job, for the same reason (0033).
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: node scripts/test-bridge.mjs
      - name: build supported Windows runtime target (amd64)
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: compile unsupported Windows targets (portability only)
        run: |
          GOOS=windows GOARCH=386 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
      - name: cross-compile non-Windows stub for darwin
        run: GOOS=darwin GOARCH=arm64 go build ./...
